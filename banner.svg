<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Eduardo Desplanches. Ciência da Computação, estágio back-end Java com Spring Boot">
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <radialGradient id="brilho" cx="0.15" cy="-0.2" r="1.1">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.30"/>
      <stop offset="0.55" stop-color="#6366f1" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grade" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#6366f1" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>

    <!-- Uma máscara por frase: a largura cresce (digitando), para e volta a zero (apagando).
         O ciclo inteiro tem 12 s, 4 s para cada frase. -->
    <clipPath id="f1"><rect x="232" y="244" height="32" width="0">
      <animate attributeName="width" dur="12s" repeatCount="indefinite"
               keyTimes="0;0.1;0.28;0.333;1" values="0;444;444;0;0"/>
    </rect></clipPath>
    <clipPath id="f2"><rect x="232" y="244" height="32" width="0">
      <animate attributeName="width" dur="12s" repeatCount="indefinite"
               keyTimes="0;0.333;0.45;0.613;0.667;1" values="0;0;520;520;0;0"/>
    </rect></clipPath>
    <clipPath id="f3"><rect x="232" y="244" height="32" width="0">
      <animate attributeName="width" dur="12s" repeatCount="indefinite"
               keyTimes="0;0.667;0.78;0.947;1" values="0;0;412;412;0"/>
    </rect></clipPath>
  </defs>

  <rect width="1280" height="320" fill="url(#fundo)"/>
  <rect width="1280" height="320" fill="url(#grade)"/>
  <rect width="1280" height="320" fill="url(#brilho)"/>
  <rect x="0" y="0" width="8" height="320" fill="#6366f1"/>

  <text x="1216" y="246" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="140" font-weight="700" fill="#6366f1" fill-opacity="0.16">{ }</text>

  <text x="72" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="56" font-weight="700" letter-spacing="-1.5" fill="#f8fafc">Eduardo Desplanches</text>

  <rect x="74" y="128" width="92" height="5" rx="2.5" fill="#6366f1"/>

  <text x="72" y="176" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="22" fill="#cbd5e1">Ciência da Computação · Estágio Back-end Java · São Paulo</text>

  <!-- Linha de terminal -->
  <rect x="64" y="226" width="744" height="62" rx="10" fill="#0b1120" fill-opacity="0.75" stroke="#334155"/>
  <text x="84" y="265" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="20" fill="#818cf8">~/eduardo $</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#e2e8f0">
    <text x="232" y="265" clip-path="url(#f1)">Spring Boot · JPA · Flyway · API REST</text>
    <text x="232" y="265" clip-path="url(#f2)">201, 404, 409: cada rota com o status certo</text>
    <text x="232" y="265" clip-path="url(#f3)">próximo commit: testes com JUnit 5</text>
  </g>

  <!-- Cursor acompanha a ponta do texto e pisca -->
  <rect x="234" y="250" width="11" height="22" fill="#6366f1">
    <animate attributeName="x" dur="12s" repeatCount="indefinite"
             keyTimes="0;0.1;0.28;0.333;0.45;0.613;0.667;0.78;0.947;1"
             values="234;678;678;234;754;754;234;646;646;234"/>
    <animate attributeName="opacity" dur="1s" repeatCount="indefinite"
             keyTimes="0;0.5;1" values="1;0;1" calcMode="discrete"/>
  </rect>
</svg>
